name: Ready Wardrobe pilot

on:
  push:
    branches:
      - codex/ready-wardrobe-pilot
      - codex/ready-wardrobe-dashboard
      - codex/ready-wardrobe-catalogue

permissions:
  contents: read

jobs:
  verify-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLERK_SECRET_KEY: sk_test_not-a-real-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsudGVzdCQ=
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-only-publishable-key
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: test-only-service-role-key
    steps:
      - name: Check out the pilot
        uses: actions/checkout@v6
      - name: Use project CI Node version
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Wardrobe access, Ready renderer and Pro standings
        run: >-
          npm test --
          tests/integration/ready-wardrobe.test.ts
          tests/integration/dashboard-ready-wardrobe.test.tsx
          tests/unit/ready-runtime.test.ts
          tests/unit/ready-menu-ui.test.tsx
          tests/unit/components/WardrobePilot.test.tsx
          tests/unit/components/ReadyDockInvitation.test.tsx
          tests/unit/components/LeaderboardExperience.test.tsx
          tests/integration/leaderboard-public-projection.test.ts
          tests/integration/public-content-alignment.test.ts
      - run: npm run build
  verify-catalogue-database:
    if: github.ref == 'refs/heads/codex/ready-wardrobe-catalogue'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
      - name: Verify wardrobe changes in disposable PostgreSQL
        run: |
          pg_bin="$(pg_config --bindir)"
          "$pg_bin/initdb" -D "$RUNNER_TEMP/catalogue-pg" -U postgres -A trust --no-locale --encoding=UTF8
          "$pg_bin/pg_ctl" -D "$RUNNER_TEMP/catalogue-pg" -l "$RUNNER_TEMP/catalogue-pg.log" -o "-h 127.0.0.1 -p 56623 -k $RUNNER_TEMP" -w start
          trap '"$pg_bin/pg_ctl" -D "$RUNNER_TEMP/catalogue-pg" -m fast -w stop' EXIT
          node scripts/ready/wardrobe-catalogue-database.mjs "$pg_bin/psql"
