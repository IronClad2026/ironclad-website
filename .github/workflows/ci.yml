name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CLERK_SECRET_KEY: sk_test_not-a-real-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsudGVzdCQ=
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-only-publishable-key
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: test-only-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Consolidated release source and environment boundaries
        run: node scripts/consolidated-release/cli.mjs check-source

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm run test

      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium

      - name: Match result and replay browser regression tests
        run: npx playwright test --config tests/browser/match-result/playwright.config.ts

      - name: Bracket geometry and private unread attention browser tests
        run: npx playwright test --config tests/browser/bracket-layout/playwright.config.ts

      - name: Match Room browser regression tests
        run: npx playwright test --config tests/browser/match-room/playwright.config.ts

      - name: Build
        run: npm run build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLERK_SECRET_KEY: sk_test_not-a-real-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsudGVzdCQ=
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-only-publishable-key
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: test-only-service-role-key
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium
      - name: Showcase browser regression tests (synthetic local actions)
        run: npx playwright test --config tests/browser/showcase/playwright.config.ts
      - name: Highlights browser regression tests (synthetic local media)
        run: npx playwright test --config tests/browser/combat-highlights/playwright.config.ts
      - name: Official News and navigation browser regression tests
        run: npx playwright test --config tests/browser/news/playwright.config.ts
      - name: Responsive public presentation regressions
        run: npx playwright test --config tests/browser/ui-redesign/playwright.config.ts
      - name: Dashboard and career browser regressions
        env:
          UI_REDESIGN_SURFACE: dashboard
        run: npx playwright test --config tests/browser/ui-redesign/playwright.config.ts
      - name: Admin match workspace regressions
        run: npx playwright test --config tests/browser/admin-match/playwright.config.ts
      - name: Admin operations regressions
        run: npx playwright test --config tests/browser/admin-operations/playwright.config.ts
      - name: Save failed synthetic browser traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-browser-failure-traces
          path: .playwright
          if-no-files-found: ignore
          retention-days: 7

  consolidated-release-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check deployable source and environment boundaries
        run: node scripts/consolidated-release/cli.mjs check-source
      - name: Check exact legal publication package without publishing
        run: node scripts/consolidated-legal/publication.mjs check
      - name: Check offline release gates and fail-closed Preview and media boundaries
        run: >-
          npx vitest run
          tests/consolidated-release/release-safety.test.ts
          tests/unit/lib/release-preview-safety.test.ts
          tests/unit/lib/p03-preview-safety.test.ts
          tests/unit/lib/combat-highlights-config.test.ts
          tests/integration/combat-highlights-disabled-boundary.test.ts

  consolidated-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CONSOLIDATED_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install exact disposable PostgreSQL protocol client without lifecycle scripts
        run: npm install --prefix "$RUNNER_TEMP/consolidated-pg-client" --ignore-scripts --no-audit --no-fund --save-exact pg@8.16.3
      - name: Check hosted rehearsal isolation guards
        run: node --test tests/consolidated-db/hosted-guards.mjs tests/consolidated-db/schema-diagnostics.mjs
      - name: Rehearse current Production catalog and consolidated candidate on real Supabase extensions
        run: node scripts/consolidated-db/hosted-runtime.mjs
      - name: Save non-sensitive actual-extension and complete restore evidence
        uses: actions/upload-artifact@v4
        with:
          name: consolidated-hosted-runtime-evidence
          path: test-results/consolidated-hosted-runtime-evidence.json
          if-no-files-found: error
          retention-days: 14

  p03-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - name: Start disposable loopback-only PostgreSQL
        run: |
          /usr/lib/postgresql/17/bin/initdb -D "$RUNNER_TEMP/p03-postgres" -U postgres -A trust --no-locale --encoding=UTF8
          /usr/lib/postgresql/17/bin/pg_ctl -D "$RUNNER_TEMP/p03-postgres" -l "$RUNNER_TEMP/p03-postgres.log" -o "-h 127.0.0.1 -p 56623 -k $RUNNER_TEMP" -w start || { cat "$RUNNER_TEMP/p03-postgres.log"; exit 1; }
          /usr/lib/postgresql/17/bin/createdb -h 127.0.0.1 -p 56623 -U postgres p03_rehearsal
      - name: Replay exact reviewed Production baseline locally
        run: node scripts/p03-db/replay-baseline.mjs /usr/lib/postgresql/17/bin/psql
      - name: Release package and receipt safety tests
        run: node --test tests/p03-db/package-checks.mjs
      - name: Staging fixture scope safety tests
        run: node --test tests/p03-preview/fixture-guards.mjs
      - name: Seed partially completed tournament fixtures
        run: node scripts/p03-db/seed-rehearsal.mjs /usr/lib/postgresql/17/bin/psql
      - name: Atomic migration, first-write barrier and lifecycle rehearsal
        run: node scripts/p03-db/rehearse.mjs /usr/lib/postgresql/17/bin/psql
      - name: Match Room SQL and concurrency regressions
        run: node scripts/p03-db/concurrency.mjs /usr/lib/postgresql/17/bin/psql
      - name: Unread summary and assistance kill-switch concurrency
        run: node scripts/p03-db/attention-concurrency.mjs /usr/lib/postgresql/17/bin/psql
      - name: Rehearse gated release executor locally
        run: node scripts/p03-db/rehearse-executor.mjs /usr/lib/postgresql/17/bin/psql
      - name: Retention privacy and case-hold SQL and concurrency
        run: |
          node scripts/p03-db/retention.mjs /usr/lib/postgresql/17/bin/psql
          node scripts/p03-db/retention-concurrency.mjs /usr/lib/postgresql/17/bin/psql
      - name: Rehearse prepared privacy publication transaction
        run: node scripts/legal-successor/rehearse-p03-privacy.mjs /usr/lib/postgresql/17/bin/psql
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/p03-postgres/postmaster.pid" ]; then
            /usr/lib/postgresql/17/bin/pg_ctl -D "$RUNNER_TEMP/p03-postgres" -m fast -w stop
          fi

  p03-hosted-backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
      - name: Rehearse full backup with real Supabase extensions
        run: node scripts/p03-release/rehearse-hosted-runtime.mjs
      - name: Save non-sensitive synthetic rehearsal evidence
        uses: actions/upload-artifact@v4
        with:
          name: p03-hosted-backup-evidence
          path: test-results/p03-hosted-backup-evidence.json
          if-no-files-found: error
          retention-days: 14
