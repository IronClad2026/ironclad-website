name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLERK_SECRET_KEY: sk_test_not-a-real-secret
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Y2xlcmsudGVzdCQ=
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: test-only-publishable-key
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_SERVICE_ROLE_KEY: test-only-service-role-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Unit and integration tests
        run: npm run test

      - name: Install browser test runtime
        id: browser-runtime
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npx playwright install --with-deps chromium

      - name: Official News browser regression tests
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        run: npx playwright test --config tests/browser/news/playwright.config.ts

      - name: Announcement editor desktop and mobile regressions
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        run: npx playwright test --config tests/browser/announcements/playwright.config.ts

      - name: Match result and replay browser regression tests
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        run: npx playwright test --config tests/browser/match-result/playwright.config.ts

      - name: Bracket geometry and private unread attention browser tests
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        run: npx playwright test --config tests/browser/bracket-layout/playwright.config.ts

      - name: Match Room browser regression tests
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        run: npx playwright test --config tests/browser/match-room/playwright.config.ts

      - name: Continuous Caster Showcase browser regressions
        if: ${{ !cancelled() && steps.browser-runtime.outcome == 'success' }}
        run: npx playwright test --config tests/browser/ui-redesign/playwright.config.ts caster-showcase.spec.ts

      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  p03-realtime-database:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 22.12.0
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
      - name: Install PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-17
      - name: Start disposable loopback-only PostgreSQL
        run: |
          /usr/lib/postgresql/17/bin/initdb -D "$RUNNER_TEMP/p03-realtime-postgres" -U postgres -A trust --no-locale --encoding=UTF8
          /usr/lib/postgresql/17/bin/pg_ctl -D "$RUNNER_TEMP/p03-realtime-postgres" -l "$RUNNER_TEMP/p03-realtime-postgres.log" -o "-h 127.0.0.1 -p 56623 -k $RUNNER_TEMP" -w start
      - name: Replay all Staging migrations, current Patch 2 authority and pinned historical Match Room behavior
        run: node scripts/p03-1/database.mjs /usr/lib/postgresql/17/bin/psql
      - name: Four-division authority, lifecycle, and historical plus current Match Room tests
        run: node scripts/four-division/database.mjs /usr/lib/postgresql/17/bin/psql
      - name: Historical Realtime transaction and generation concurrency
        run: node scripts/p03-1/realtime-concurrency.mjs /usr/lib/postgresql/17/bin/psql
      - name: Historical Match Room concurrency and full-head replay and result checks
        run: |
          node scripts/p03-1/concurrency.mjs /usr/lib/postgresql/17/bin/psql
          node scripts/p03-1/attention-concurrency.mjs /usr/lib/postgresql/17/bin/psql
          node scripts/p03-1/retention-concurrency.mjs /usr/lib/postgresql/17/bin/psql
          node scripts/p03-1/repeatability.mjs /usr/lib/postgresql/17/bin/psql
          node scripts/p03-1/result-regressions.mjs /usr/lib/postgresql/17/bin/psql
      - name: Caster Tournament Media transition and concurrency
        env:
          P03_PG_PORT: '56624'
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/17/bin
          pg_dir="$RUNNER_TEMP/caster-tournament-media-postgres"
          "$pg_bin/initdb" -D "$pg_dir" -U postgres -A trust --no-locale --encoding=UTF8
          trap '"$pg_bin/pg_ctl" -D "$pg_dir" -m fast -w stop' EXIT
          "$pg_bin/pg_ctl" -D "$pg_dir" -l "$RUNNER_TEMP/caster-tournament-media.log" -o "-h 127.0.0.1 -p 56624 -k $RUNNER_TEMP" -w start
          node tests/database/caster-phase4-coverage.mjs "$pg_bin/psql"
      - name: Stop disposable PostgreSQL
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/p03-realtime-postgres/postmaster.pid" ]; then
            /usr/lib/postgresql/17/bin/pg_ctl -D "$RUNNER_TEMP/p03-realtime-postgres" -m fast -w stop
          fi
